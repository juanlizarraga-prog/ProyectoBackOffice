<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - BackOffice</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    if (!localStorage.getItem("authToken")) {
      location.href = "login.html";
    }
  </script>
</head>
<body>
  <div class="panel">
    <div class="barra-lateral">
      <div class="marca">
        <div class="icono" style="width: 34px; height: 34px; margin-bottom: 0;">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <span>BackOffice</span>
      </div>

      <div class="menu">
        <a href="home.html" class="enlace-menu activo">Inicio</a>
        <a href="#" class="enlace-menu">Usuarios</a>
        <a href="#" class="enlace-menu">Reportes</a>
        <a href="#" class="enlace-menu">Ajustes</a>
      </div>

      <div>
        <a href="#" id="btn-logout" class="enlace-menu">Cerrar sesion</a>
      </div>
    </div>

    <div class="contenido-principal">
      <div class="barra-superior">
        <h2>Panel Principal</h2>
        <span id="user-name">Administrador</span>
      </div>

      <div class="contenido">
        <div class="seccion-encabezado">
          <h2>Gestión de Proyectos</h2>
          <button type="button" id="btn-toggle-form" class="boton boton-nuevo">+ Agregar Proyecto</button>
        </div>

        <div id="contenedor-formulario" class="formulario-proyecto-contenedor oculto">
          <h3 id="form-titulo">Nuevo Proyecto</h3>
          <div id="form-error-message" class="alerta-error oculto"></div>
          <form id="form-proyecto" class="formulario">
            <input type="hidden" id="proyecto-id">

            <div class="campo">
              <label for="proyecto-titulo" class="etiqueta">Título *</label>
              <input type="text" id="proyecto-titulo" class="input" placeholder="Nombre del proyecto" required>
            </div>

            <div class="campo">
              <label for="proyecto-descripcion" class="etiqueta">Descripción *</label>
              <textarea id="proyecto-descripcion" class="input" rows="3" placeholder="Descripción detallada" required></textarea>
            </div>

            <div class="campo">
              <label for="proyecto-tecnologias" class="etiqueta">Tecnologías (separadas por coma)</label>
              <input type="text" id="proyecto-tecnologias" class="input" placeholder="JavaScript, Node.js, CSS">
            </div>

            <div class="campo">
              <label for="proyecto-repositorio" class="etiqueta">Repositorio (URL Opcional)</label>
              <input type="text" id="proyecto-repositorio" class="input" placeholder="https://github.com/usuario/proyecto" required>
            </div>

            <div class="campo">
              <label for="proyecto-imagenes" class="etiqueta">Imágenes (URLs separadas por coma)</label>
              <input type="text" id="proyecto-imagenes" class="input" placeholder="https://ejemplo.com/foto1.jpg, https://ejemplo.com/foto2.jpg">
            </div>

            <div class="formulario-acciones">
              <button type="submit" id="btn-guardar" class="boton">Guardar Proyecto</button>
              <button type="button" id="btn-cancelar" class="boton-secundario">Cancelar</button>
            </div>
          </form>
        </div>

        <div id="proyectos-contenedor" class="proyectos-grid"></div>
      </div>
    </div>
  </div>
  <script src="js/home.js"></script>
</body>
</html>
