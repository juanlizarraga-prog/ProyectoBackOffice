<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - BackOffice</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="contenedor">
    <div class="tarjeta">
      <div class="encabezado">
        <div class="icono">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <h1 class="titulo">Crear Cuenta</h1>
        <p class="subtitulo">Registrate para comenzar</p>
      </div>

      <div id="error-message" class="alerta-error oculto"></div>

      <form class="formulario">
        <div class="campo">
          <label for="nombre" class="etiqueta">Nombre completo</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            class="input" 
            placeholder="Nombre y apellido" 
            required
          >
        </div>

        <div class="campo">
          <label for="itsonId" class="etiqueta">ID ITSON</label>
          <input 
            type="text" 
            id="itsonId" 
            name="itsonId" 
            class="input" 
            placeholder="6 dígitos numéricos" 
            pattern="[0-9]{6}" 
            maxlength="6" 
            required
          >
        </div>

        <div class="campo">
          <label for="correo" class="etiqueta">Correo electronico</label>
          <input 
            type="email" 
            id="correo" 
            name="correo" 
            class="input" 
            placeholder="usuario@ejemplo.com" 
            required
          >
        </div>

        <div class="campo">
          <label for="password" class="etiqueta">Contrasena</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="input" 
            placeholder="Minimo 6 caracteres" 
            required
          >
        </div>

        <div class="campo">
          <label for="confirmar-password" class="etiqueta">Confirmar contrasena</label>
          <input 
            type="password" 
            id="confirmar-password" 
            name="confirmar-password" 
            class="input" 
            placeholder="Repite tu contrasena" 
            required
          >
        </div>

        <button type="submit" class="boton">Registrarse</button>
      </form>

      <div class="pie">
        <p>Ya tienes una cuenta? <a href="login.html">Inicia sesion</a></p>
      </div>
    </div>
  </div>
  <script src="js/register.js"></script>
</body>
</html>
